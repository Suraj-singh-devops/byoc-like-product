{{- /* Secret Manager secrets mounted as files by the GKE Secret Manager add-on. Each pod reads them
with its own Workload Identity, which Terraform grants per secret. */ -}}
{{- if eq .Values.secrets.source "secretManager" }}
{{- $project := required "gcp.projectId is required with secretManager" .Values.gcp.projectId }}
{{- range $name, $keys := dict "byoc-platform" (list "secret-key" "redis-password") "byoc-redis" (list "redis-password") }}
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ $name }}
  labels:
    {{- include "dp.labels" $ | nindent 4 }}
spec:
  provider: gke
  parameters:
    secrets: |
      {{- range $key := $keys }}
      - resourceName: "projects/{{ $project }}/secrets/{{ index $.Values.secrets.names $key }}/versions/latest"
        path: "{{ $key }}"
      {{- end }}
{{- end }}
{{- end }}
