{{- /* One Kubernetes ServiceAccount per workload (docs/adr/0004); on GKE each acts as its own Google
service account through Workload Identity. The console needs no Google identity at all. */ -}}
{{- range $ksa := list "api" "cluster-manager" "terraform-runner" "monitoring-worker" "redis" "frontend" }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $ksa }}
  labels:
    {{- include "dp.labels" $ | nindent 4 }}
  {{- with index $.Values.gcp.serviceAccounts $ksa }}
  annotations:
    iam.gke.io/gcp-service-account: {{ . }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
